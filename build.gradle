plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.20.1'
    id 'jacoco'
    id 'pmd'
}

group = 'com.LuisPPB16'
version = '1.1.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << "-Xlint:all" << "-Werror" << "-Xlint:-processing" << "-Xlint:-rawtypes"
}

intellijPlatform {
    buildSearchableOptions = false
    signing.certificateChain.set(providers.environmentVariable("CERTIFICATE_CHAIN"))
    signing.privateKey.set(providers.environmentVariable("PRIVATE_KEY"))
    signing.password.set(providers.environmentVariable("PRIVATE_KEY_PASSWORD"))
    publishing.token.set(providers.environmentVariable("PUBLISH_TOKEN"))
    pluginVerification {
        ides {
            recommended()
        }
        ignoredProblemsFile.set(file('config/pluginVerifier/ignored-problems.txt'))
    }
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdea '2026.3'
        bundledPlugin 'com.intellij.java'
    }

    constraints {
        testImplementation('org.apache.commons:commons-compress:1.28.0') {
            because 'avoid CVEs in the transitive test classpath'
        }
    }

    implementation 'io.swagger.parser.v3:swagger-parser:2.1.48'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.23.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.23.0'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'junit:junit:4.13.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }

    maxHeapSize = '512m'

    // Avoid noisy CDS warnings triggered by IntelliJ test classloader configuration.
    jvmArgs('-Xshare:off',
            '-Dcom.mysql.cj.disableAbandonedConnectionCleanup=true',
            '-Dpgjdbc.config.cleanup.thread.ttl=1')

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

pmd {
    toolVersion = '7.29.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
}